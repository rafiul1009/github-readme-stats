# GitHub Action delivery mode (docs/PLAN.md §6, docs/TODOS.md 5.5).
#
# Renders a widget on a schedule and commits the SVG straight into your own
# repo, so your README embeds a file that lives in your own repo instead of
# a live link to this project's hosting — zero runtime dependency on our
# uptime. Uses the repo's built-in GITHUB_TOKEN; no PAT setup needed.
#
# Copy this file to .github/workflows/update-widget.yml in your GitHub
# profile repo (the one named exactly like your username), replace
# WIDGET_URL below with the URL you built at /build, and commit. Or, use
# the "GitHub Action" tab in the builder's copy-out panel to generate this
# file already filled in for your specific widget.

name: Update GitHub README widget

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours — adjust to taste
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the widget SVG
        env:
          WIDGET_URL: "https://your-deployment.example.com/api/widget/streak?username=octocat&theme=dark"
          OUTPUT_PATH: "profile/streak.svg"
        run: |
          mkdir -p "$(dirname "$OUTPUT_PATH")"
          curl -fsSL "$WIDGET_URL" -o "$OUTPUT_PATH"

      - name: Commit if it changed
        env:
          OUTPUT_PATH: "profile/streak.svg"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"
          git diff --cached --quiet || git commit -m "chore: update $OUTPUT_PATH"
          git push
