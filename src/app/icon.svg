<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Profilecraft mark, compact two-card cut (docs/TODOS.md 12.28). Static
       colours rather than currentColor: a favicon has no inherited colour, and
       the dark tile keeps the mark legible against light and dark browser
       chrome alike. Geometry mirrors COMPACT_CARDS in components/brand/Logo.tsx. -->
  <defs>
    <mask id="pc-icon-cut">
      <rect width="32" height="32" fill="#fff"/>
      <rect x="3.5" y="12.75" width="25" height="15" rx="5" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="7" fill="#16141f"/>
  <rect x="7" y="5.75" width="18" height="10" rx="3" fill="#b9a8ff" mask="url(#pc-icon-cut)"/>
  <rect x="5" y="14.25" width="22" height="12" rx="3.5" fill="#7c5cff"/>
</svg>
